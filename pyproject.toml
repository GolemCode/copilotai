[project]
name = "copilotai"
version = "0.1.0"
description = "Copilote financier : données de marché scrapées, métriques de risque, simulation Monte Carlo, stress tests et RAG sur fiches d'ETF."
readme = "README.md"
authors = [{ name = "GolemCode", email = "su.ywjack@gmail.com" }]
requires-python = ">=3.12,<4"
dependencies = [
    # Calcul numérique et données
    "numpy>=2.4.6,<3",
    "polars>=1.41.2,<2",
    "pandas>=3.0.3,<4",
    "pyarrow>=17.0.0,<18",
    # API, base de données, tâches asynchrones
    "fastapi>=0.137.1,<0.138",
    "uvicorn>=0.49.0,<0.50",
    "websockets>=13.0,<14",
    "pydantic>=2.13.4,<3",
    "asyncpg>=0.31.0,<0.32",
    "psycopg[binary]>=3.3.4,<4",
    "celery>=5.6.3,<6",
    "redis>=8.0.0,<9",
    # Collecte des données (Yahoo Finance, JustETF, Wikipédia)
    "yfinance>=1.4.1,<2",
    "requests>=2.34.2,<3",
    "beautifulsoup4>=4.15.0,<5",
    "lxml>=6.1.1,<7",
    "html5lib>=1.1,<2",
    # RAG : embeddings, base vectorielle pgvector, LLM
    "groq>=1.4.0,<2",
    "langchain-core>=1.4.8,<2",
    "langchain-postgres>=0.0.17,<0.0.18",
    "langchain-huggingface>=1.2.2,<2",
    "langchain-text-splitters>=1.1.0,<2",
    "sentence-transformers>=5.6.0,<6",
    # Déclaré explicitement pour imposer la version CPU (cf. [tool.uv.sources])
    "torch>=2.7.1,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17,<0.16",
    "pytest>=9.1.0,<10",
    "mypy>=2.1.0,<3",
    # PostgreSQL embarqué (avec pgvector) pour les tests d'intégration, sans Docker
    "pgserver>=0.1.4,<0.2",
]

[tool.uv]
# Application (API + worker), pas une bibliothèque à publier : uv n'installe pas le projet lui-même
package = false

# torch en version CPU : le modèle d'embedding tourne sur CPU dans les conteneurs ;
# évite plusieurs Go de bibliothèques CUDA dans l'image Docker.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le projet n'est pas installé comme paquet (tool.uv.package = false) : racine ajoutée au sys.path
pythonpath = ["."]
markers = [
    "integration: tests exécutés sur un vrai PostgreSQL embarqué (pgserver)",
]

[tool.ruff.lint.per-file-ignores]
# Les scripts ajoutent la racine du projet au sys.path avant leurs imports
"scripts/*" = ["E402"]
