version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: copilot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - copilot_network

  redis:
    image: redis:7-alpine
    container_name: copilot_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - copilot_network

networks:
  copilot_network:
    driver: bridge

volumes:
  pgdata: