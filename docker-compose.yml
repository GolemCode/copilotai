services:
  db:
    image: pgvector/pgvector:pg16
    container_name: copilot_postgres
    restart: always
    env_file: 
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - copilot_network

  redis:
    image: redis:7-alpine
    container_name: copilot_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - copilot_network

  api:
    build: .
    image: copilotai-app:latest
    container_name: copilot_api
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "127.0.0.1:8000:8000"
    # Environnement de développement : rechargement automatique du code monté en volume
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis
    volumes:
      - shared_shm:/tmp/shared
      # Code local monté dans le conteneur (l'environnement Python est dans /opt/venv)
      - .:/app
    networks:
      - copilot_network

  worker:
    build: .
    image: copilotai-app:latest
    container_name: copilot_worker
    restart: always
    env_file:
      - .env  # Obligatoire pour que Celery puisse écrire dans la DB
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    volumes:
      - shared_shm:/tmp/shared
      - .:/app
    networks:
      - copilot_network

  frontend:
    build: ./frontend
    container_name: copilot_frontend
    restart: always
    environment:
      - CHOKIDAR_USEPOLLING=true # Obligatoire pour le Hot Reload sous Windows/WSL
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app # Synchronisation du code local avec le conteneur
      - /app/node_modules # Sécurisation des modules compilés
    networks:
      - copilot_network

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: copilot_airflow_init
    env_file:
      - .env
    environment:
      # Isolation : Airflow tape dans airflow_db, pas dans ta DB métier
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/airflow_db
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:?Definir AIRFLOW_ADMIN_PASSWORD dans .env (voir .env.example)}
    depends_on:
      - db
    networks:
      - copilot_network
    command: version

  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: copilot_airflow_webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/airflow_db
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    networks:
      - copilot_network
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: copilot_airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/airflow_db
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    networks:
      - copilot_network
    command: scheduler

networks:
  copilot_network:
    driver: bridge

volumes:
  pgdata:
  shared_shm: